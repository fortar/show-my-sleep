<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早睡早起</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@2.12/lib/index.css" />

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vant@2.12/lib/vant.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.2.2/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  
  <style>
    #myChart {
      width: 100%;
      height: 400px;
    }
    .sleep-list .van-cell {
      line-height: 16px;
    }
    .sleep-day .van-cell {
      line-height: 16px;
    }
    .sleep-day .van-cell__title {
      font-size: 18px;
      font-weight: bold;
    }
    .wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  .block {
    width: 120px;
    height: 120px;
  }
  </style>
</head>

<body>
  <div class="chart-wraper">
    <div id="myChart"></div>
  </div>

  <div id="myList">
    <van-cell>
      <van-button round type="info" @click="createData">
        <van-icon name="plus" />
      </van-button>
    </van-cell>
    <van-list
      v-model="loading"
      :finished="finished"
      finished-text="没有更多了"
      class="sleep-list"
    >
      <van-cell-group style="margin: 20px auto;" v-for="(item, k) in list" :key="k">
        <van-cell :title="item.day+'（'+ item.dayWithWeek + '）'" class="sleep-day">
          <van-button round type="warning" size="mini" @click="editData(item)">
            <van-icon name="edit" />
          </van-button>
          <van-button round type="danger" size="mini" @click="deleteData(item)">
            <van-icon name="delete" />
          </van-button>
        </van-cell>
        <van-cell title="睡觉时间" :value="item.start"></van-cell>
        <van-cell title="起床时间" :value="item.end"></van-cell>
        <van-cell title="备注" :value="item.text"></van-cell>
      </van-cell-group>
    </van-list>

    <van-dialog v-model="showDialog" title="标题" show-cancel-button @confirm="submitForm">
      <van-cell-group>
        <van-field
          readonly
          clickable
          v-model="monthDay"
          label="日期"
          placeholder="点击选择"
          @click="startEditMonthDay"
        />
      </van-cell-group>

      <van-cell-group>
        <van-field
          readonly
          clickable
          v-model="startTime"
          label="睡觉时间"
          placeholder="点击选择"
          @click="startEditStartTime"
        />
      </van-cell-group>

      <van-cell-group>
        <van-field
          readonly
          clickable
          v-model="endTime"
          label="起床时间"
          placeholder="点击选择"
          @click="startEditEndTime"
        />
      </van-cell-group>

      <van-cell-group>
        <van-field
          v-model="description"
          rows="1"
          autosize
          label="备注"
          type="textarea"
          placeholder="输入备注"
        />
      </van-cell-group>
    </van-dialog>
    

    <van-popup v-model="showTimePopup" position="bottom">
      <van-datetime-picker
        v-model="defaultTime"
        :type="datetimePickerType"
        :title="datetimePickerTitle"
        @confirm="onConfirmTime"
        @cancel="showTimePopup = false"
        :formatter="dateFormatter"
      />
    </van-popup>

    <van-overlay :show="loading">
        <div class="wrapper" @click.stop>
          <van-loading class="block" type="spinner" color="#1989fa" />
        </div>
    </van-overlay>

  </div>
  
  

</body>

<script type="module" src="js/data.js"></script>
<script type="module" src="js/myList.js"></script>
<script type="module" src="js/myChart.js"></script>

</html>
